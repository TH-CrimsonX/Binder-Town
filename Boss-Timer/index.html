<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Binder Town Boss Timer" />
    <title>Binder Town Boss Timer</title>
    <link rel="icon" type="image/png" href="https://wiki.bindertowngame.com/img/ui/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <img src="https://wiki.bindertowngame.com/img/ui/logo.png" alt="Binder Town Logo" class="brand-logo" />
        <div>
          <p class="eyebrow">Binder Town</p>
          <h1>Boss Timer</h1>
        </div>
      </div>
      <div class="top-actions">
        <div class="live-pill">Version 1.0.0 | Update October 20, 2026</div>
      </div>
    </header>

    <main class="page-shell">
      <div class="category-toolbar">
        <nav class="category-tabs" aria-label="Boss categories">
          <button type="button" class="tab-btn active" data-category="Field Boss">Field-Boss</button>
          <button type="button" class="tab-btn" data-category="Mini-Boss">Mini-Boss</button>
          <button type="button" class="tab-btn" data-category="Elite">Elite</button>
        </nav>

        <div class="sound-toggle-shell" aria-label="เสียงแจ้งเตือน">
          <span class="sound-toggle-label">เสียงแจ้งเตือน</span>
          <button id="global-sound-toggle" class="sound-toggle-btn" type="button" aria-label="ปิดเสียงแจ้งเตือน">🔊</button>
        </div>
      </div>

      <section class="category-panel" aria-live="polite">
        <div id="boss-grid" class="boss-grid"></div>
      </section>
    </main>

    <dialog id="update-dialog">
      <form id="update-form" method="dialog">
        <div class="dialog-head">
          <h3 id="dialog-title">บันทึกเวลาเกิดบอส</h3>
          <button type="button" id="close-dialog" class="close-button" aria-label="Close">×</button>
        </div>

        <div class="field-group">
          <label for="boss-name">บอส</label>
          <input id="boss-name" type="text" readonly />
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="record-name">ชื่อคนบันทึก</label>
            <input id="record-name" name="recordName" type="text" maxlength="30" placeholder="กรอกชื่อ" required />
          </div>
          <div class="field-group">
            <label for="record-ip">IP</label>
            <input id="record-ip" name="recordIp" type="text" maxlength="45" readonly placeholder="กำลังระบุ IP..." required />
          </div>
        </div>

        <div class="field-row time-field-row">
          <div class="field-group">
            <label for="remaining-hours">ชั่วโมง</label>
            <input id="remaining-hours" name="remainingHours" type="number" min="0" max="99" step="1" value="0" />
          </div>
          <div class="field-group">
            <label for="remaining-mins">นาที</label>
            <input id="remaining-mins" name="remainingMinutes" type="number" min="0" max="59" step="1" value="0" required />
          </div>
          <div class="field-group">
            <label for="remaining-secs">วินาที</label>
            <input id="remaining-secs" name="remainingSeconds" type="number" min="0" max="59" step="1" value="0" />
          </div>
        </div>

        <div class="dialog-footer">
          <button type="submit" class="primary-btn">อัปเดตเวลา</button>
        </div>
      </form>
    </dialog>

    <dialog id="boss-detail-dialog" class="detail-dialog">
      <div class="detail-dialog-shell">
        <div class="dialog-head">
          <div class="detail-boss-header">
            <img id="detail-image" class="boss-thumb detail-img" src="" alt="Boss portrait" />
            <div>
              <span id="detail-category" class="detail-category"></span>
              <h3 id="detail-name" class="detail-name"></h3>
              <div id="detail-meta" class="detail-meta"></div>
            </div>
          </div>
          <button type="button" id="close-detail-dialog" class="close-button" aria-label="Close">×</button>
        </div>

        <div class="detail-body">
          <section class="detail-section">
            <h4>ภาพรวม</h4>
            <ul id="detail-overview" class="detail-list"></ul>
          </section>

          <section class="detail-section">
            <h4>แพ้ทาง / ชนะทาง</h4>
            <ul id="detail-matchup" class="detail-list"></ul>
          </section>

          <section id="detail-skills-section" class="detail-section">
            <h4>ท่าพิเศษ</h4>
            <ul id="detail-skills" class="detail-list"></ul>
          </section>

          <a id="detail-boss-source" class="detail-source-link" href="#" target="_blank" rel="noopener noreferrer">แหล่งข้อมูล: Binder Town Wiki</a>
        </div>
      </div>
    </dialog>

    <footer class="site-footer">
      <span>Developed by</span>
      <img src="https://avatars.githubusercontent.com/u/96268091?v=4" alt="CrimsonX avatar" class="footer-avatar" />
      <strong>CrimsonX</strong>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
