<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Map — แผนที่ Binder Town ทุกแมพ" />
    <title>Map — Binder Town</title>
    <link rel="icon" type="image/png" href="https://wiki.bindertowngame.com/img/ui/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../Tools/Card-Simulator/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h2>แผนที่โลก</h2>
        <img src="../../Data/map-bg.png" alt="แผนที่โลก Binder Town" style="width:100%;border-radius:14px;border:1px solid rgba(154,176,198,.2)" />      <p class="hint">แผนที่รวมของโลก — แมพย่อยทั้งหมดจัดอยู่ตามภูมิภาคด้านล่าง</p>
      </section>
      <section class="card">
        <h2>แมพย่อยทั้งหมด</h2>
        <p class="hint">% = สัดส่วนมอนในแมพนั้นที่มีลักษณะ/ธาตุดังกล่าว (จาก Threats)</p>
        <div class="filters">
          <select id="mp-region"></select>
        </div>
        <div class="card-grid" id="map-list"></div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="../../Data/mobs.js"></script>
    <script src="../../Tools/nav.js"></script>
    <script src="map.js"></script>
  </body>
</html>
