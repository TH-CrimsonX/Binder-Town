<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Patch Note — สรุปการอัปเดต Binder Town พร้อมระบบที่เกี่ยวข้อง (อ้างอิง Binder Town Wiki)" />
    <title>Patch Note — Binder Town Tools</title>
    <link rel="icon" type="image/png" href="https://wiki.bindertowngame.com/img/ui/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../Tools/Card-Simulator/styles.css" />
    <style>
      .patch-wrap { display: grid; gap: 12px; }
      .patch-item {
        border-left: 3px solid var(--gold);
        border-radius: 0 10px 10px 0;
        background: rgba(255, 200, 87, 0.06);
        padding: 12px 16px;
      }
      .patch-item b { color: var(--text); display: block; margin-bottom: 2px; }
      .patch-item p { margin: 4px 0 6px; color: var(--muted); font-size: 0.92rem; }
      .patch-item .rel {
        display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
      }
      .patch-item .rel a {
        font-size: 0.78rem; padding: 3px 10px; border-radius: 999px;
        border: 1px solid rgba(89, 208, 255, 0.35);
        color: var(--accent); text-decoration: none;
      }
      .patch-item .rel a:hover { background: rgba(89, 208, 255, 0.12); }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h2>📦 Patch Note — อัปเดตล่าสุดของเกม</h2>
        <p class="hint">
          สรุปการอัปเดตสำคัญของ Binder Town (เทียบตัวเกม ณ 30 ต.ค. 2569) ·
          Patch Note ต้นฉบับอยู่ในเกมเมนู "Patch Note" ·
          ที่มา: <a href="https://wiki.bindertowngame.com/items" target="_blank" rel="noopener">Wiki — Items</a> ·
          <a href="https://wiki.bindertowngame.com/jobs" target="_blank" rel="noopener">Wiki — Jobs</a>
        </p>
        <div class="patch-wrap" id="patch-list"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="../../Tools/nav.js"></script>
    <script>
      "use strict";
      const ROOT = "../../";
      const PATCHES = [
        {
          title: "อาชีพใหม่ · Binder (สายเริ่มต้น)",
          desc:
            "ผู้เล่นใหม่เริ่มที่สาย Binder: สู้ด้วยกำปั้นเหล็ก (Knuckles) + ผูกวิญญาณมอนเป็นอาวุธ ก่อนเลือก 1 ใน 7 สายหลัก (Knight · Warrior · Scout · Rogue · Mage · Acolyte · Summoner)",
          links: [["อาชีพ", "jobs/index.html"]],
        },
        {
          title: "อาวุธ / ตระกูลใหม่",
          desc:
            "เพิ่มตระกูล Rod (หวายเวท) · Knuckles (กำปั้นเหล็ก) · Maul (ค้อนยักษ์) พร้อมสไปรต์จากตัวเกม · ไอเท็มทั้งเกมรวม 1,771 ชิ้น",
          links: [["Armory", "armory/index.html"]],
        },
        {
          title: "Region E · Tidehaven (เดิมชื่อ Nacreon)",
          desc:
            "แมพใหม่ 6 แห่ง Lv 99–113 · การ์ดใหม่กว่า 50 ใบ (รวม Spell Amp: Hollow Caster · Pearl Wisp)",
          links: [
            ["Map", "map/index.html"],
            ["Card Codex", "card/index.html"],
          ],
        },
        {
          title: "ปรับสมดุลการ์ด",
          desc:
            "Umbral Horror · Marrow Horror · Pitch Brute · Sky Sentinel ได้เจาะเกราะ (Armor Pierce) เพิ่ม · Resonance สีนับการ์ด ★3 ขึ้นไป",
          links: [["Card Codex", "card/index.html"]],
        },
        {
          title: "ระบบการ์ด (Spirit Album)",
          desc:
            "9 ช่องเปิด Lv 12/18/25/32/40/50/60/70/85 · Spirit Load สูงสุด 18 · ใบซ้ำ (Echo) ได้ผล 50% / 25%",
          links: [
            ["Card Codex", "card/index.html"],
            ["Card Book Simulator", "../Tools/Card-Simulator/index.html"],
          ],
        },
      ];
      const box = document.getElementById("patch-list");
      box.innerHTML = PATCHES.map(
        (p) => `
        <article class="patch-item">
          <b>${p.title}</b>
          <p>${p.desc}</p>
          <div class="rel">
            ${p.links
              .map(
                ([n, h]) =>
                  `<a href="${ROOT}Data/${h}">${n}</a>`,
              )
              .join("")}
          </div>
        </article>`,
      ).join("");
    </script>
  </body>
</html>
